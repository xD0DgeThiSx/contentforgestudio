<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0D1A20">
<link rel="icon" type="image/png" href="/cfs-badge-sm.png">
<style>[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}</style>
<title>Territory Visits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one narrow column built for a phone in the car. Sticky header (views + day tabs), zip-grouped office cards, bottom sheet for logging a visit. */
:root {
  --bg: #F1F4F5;
  --surface: #FFFFFF;
  --ink: #12232B;
  --muted: #566B74;
  --line: #D6E0E3;
  --accent: #0B7A85;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCF0F2;
  --tier-a: #1B7F47;
  --tier-a-soft: #DAF2E3;
  --tier-b: #A8680F;
  --tier-b-soft: #FAEBCB;
  --tier-c: #566B74;
  --tier-c-soft: #E4EAEC;
  --warn: #B83C0A;
  --warn-soft: #FCE4D6;
  --danger: #B42318;
  --display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1A20; --surface: #15262E; --ink: #E5EEF1; --muted: #92A8B1; --line: #28424C;
    --accent: #4CC3CE; --accent-ink: #06262B; --accent-soft: #123A40;
    --tier-a: #5FD08A; --tier-a-soft: #163B27; --tier-b: #E9B251; --tier-b-soft: #3D2F12;
    --tier-c: #92A8B1; --tier-c-soft: #22353D; --warn: #FF9D68; --warn-soft: #432610; --danger: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1A20; --surface: #15262E; --ink: #E5EEF1; --muted: #92A8B1; --line: #28424C;
  --accent: #4CC3CE; --accent-ink: #06262B; --accent-soft: #123A40;
  --tier-a: #5FD08A; --tier-a-soft: #163B27; --tier-b: #E9B251; --tier-b-soft: #3D2F12;
  --tier-c: #92A8B1; --tier-c-soft: #22353D; --warn: #FF9D68; --warn-soft: #432610; --danger: #FF8A80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; }
body.lock { overflow: hidden; }
.wrap { max-width: 720px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-top: 14px; }
.titlebar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font: 700 22px/1.1 var(--display); letter-spacing: -0.01em; margin: 0; }
.sub { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.views { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 12px; padding: 4px; background: var(--line); border-radius: 12px; }
.views button { border: 0; background: transparent; border-radius: 9px; min-height: 40px; font-weight: 600; font-size: 13px; color: var(--muted); padding: 0 2px; }
.views button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px; background: var(--warn); color: #fff; font-size: 12px; line-height: 20px; font-variant-numeric: tabular-nums; }
.days { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 12px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.day { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; min-height: 44px; font-weight: 600; font-size: 14px; display: flex; flex-direction: column; justify-content: center; align-items: center; line-height: 1.15; }
.day small { font-weight: 500; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.day[aria-pressed="true"] small { color: var(--accent-ink); opacity: .85; }

.filters { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 6px; }
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 14px; font-size: 16px; min-height: 46px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; min-height: 36px; font-size: 13px; font-weight: 500; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.progress { color: var(--muted); font-size: 13px; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }

.zip { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 20px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.zip h3 { margin: 0; font: 700 13px/1.2 var(--display); text-transform: uppercase; letter-spacing: .08em; }
.zip span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.cards { display: flex; flex-direction: column; gap: 8px; }
.office { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
.office:hover { border-color: var(--accent); }
.o-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.o-name { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; min-width: 0; }
.o-addr { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.o-meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--muted); }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; font-weight: 500; color: var(--muted); }
.pill.prio { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
.pill.follow { background: var(--warn-soft); border-color: transparent; color: var(--warn); font-weight: 600; }
.pill.done { background: var(--tier-a-soft); border-color: transparent; color: var(--tier-a); font-weight: 600; }
.pill.nofit { text-decoration: line-through; }
.pill.verify { border-style: dashed; }
.tier { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font: 700 14px var(--display); border: 1px dashed var(--line); color: var(--muted); }
.tier.A { background: var(--tier-a-soft); color: var(--tier-a); border: 0; }
.tier.B { background: var(--tier-b-soft); color: var(--tier-b); border: 0; }
.tier.C { background: var(--tier-c-soft); color: var(--tier-c); border: 0; }
.empty { color: var(--muted); padding: 28px 4px; text-align: center; }
.note { color: var(--muted); font-size: 12px; margin-top: 28px; }
.note.warn { color: var(--warn); }

.group-title { margin: 22px 0 8px; font: 700 13px/1.2 var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.group-title.over { color: var(--warn); }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; margin-bottom: 8px; min-width: 0; }
.row .r-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.row .r-name { font-weight: 600; overflow-wrap: anywhere; }
.row .r-date { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .r-body { font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
.row .r-sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 14px; min-height: 40px; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); }
.btn.ghost { background: transparent; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }

/* bottom sheet */
.backdrop { position: fixed; inset: 0; background: rgba(5, 15, 20, .55); z-index: 40; }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 94%; overflow-y: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)); overscroll-behavior: contain; animation: rise .18s ease-out; }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
@media (min-width: 720px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 4vh; width: 620px; max-height: 92vh; transform: translateX(-50%); border-radius: 18px; animation: none; padding-bottom: 28px; }
}
.s-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.s-head h2 { margin: 0; font: 700 20px/1.2 var(--display); overflow-wrap: anywhere; min-width: 0; }
.close { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 44px; height: 44px; font-size: 20px; line-height: 1; }
.s-info { margin-top: 10px; display: grid; gap: 4px; font-size: 14px; }
.s-info a { color: var(--accent); font-weight: 600; }
.s-info .muted { color: var(--muted); }
.s-info .addr { overflow-wrap: anywhere; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 14px; min-height: 32px; }
details p { margin: 6px 0 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.sec { margin-top: 18px; }
.sec h4 { margin: 0 0 8px; font: 700 12px/1.2 var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; min-height: 46px; font-weight: 700; font-family: var(--display); font-size: 16px; }
.seg button[aria-pressed="true"].A { background: var(--tier-a-soft); color: var(--tier-a); border-color: var(--tier-a); }
.seg button[aria-pressed="true"].B { background: var(--tier-b-soft); color: var(--tier-b); border-color: var(--tier-b); }
.seg button[aria-pressed="true"].C { background: var(--tier-c-soft); color: var(--tier-c); border-color: var(--tier-c); }
.seg button[aria-pressed="true"].N { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.field { display: grid; gap: 4px; margin-bottom: 10px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 12px; font-size: 16px; min-height: 46px; min-width: 0; }
.field textarea { min-height: 96px; resize: vertical; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0 10px; }
.hint { font-size: 12px; color: var(--muted); margin: -4px 0 10px; }
.save { width: 100%; min-height: 50px; font-size: 16px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; max-width: min(92vw, 420px); background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; }
.hist .row { background: var(--surface); }
.drive-sum { margin-top: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: grid; gap: 4px; }
.drive-sum .ds-top { font: 700 17px/1.2 var(--display); }
.drive-sum .ds-sub { color: var(--muted); font-size: 13px; }
.navs { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.navs a { text-decoration: none; display: inline-flex; align-items: center; color: var(--accent-ink); background: var(--accent); border-radius: 9px; padding: 0 14px; min-height: 44px; font-weight: 600; font-size: 14px; }
.navs a.alt { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.stop { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 10px; margin-bottom: 8px; }
.stop.worked { opacity: .55; }
.seq { width: 30px; height: 30px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font: 700 13px var(--display); font-variant-numeric: tabular-nums; }
.stop-main { border: 0; background: transparent; text-align: left; padding: 4px 0; display: grid; gap: 3px; min-width: 0; }
.go { text-decoration: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 9px; min-height: 44px; min-width: 52px; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.warnline { color: var(--warn); font-size: 13px; font-weight: 600; }
.loading { color: var(--muted); padding: 30px 0; text-align: center; }
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 0}
.authcard{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:12px}
.authcard h1{font:700 22px var(--display);margin:0}
.authcard label{display:grid;gap:4px;font-weight:600;font-size:13px;color:var(--muted)}
.authcard input{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);color:var(--ink)}
.signout{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;margin-left:8px}
.importcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0;display:grid;gap:10px}
</style>
</head>
<body>
<div id="auth" class="auth" hidden>
  <form id="authform" class="authcard" autocomplete="on">
    <h1>Territory Visits</h1>
    <p class="note">Private. Sign in to continue.</p>
    <label>Email<input id="authemail" type="email" autocomplete="username" required></label>
    <label>Password<input id="authpass" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
    <p class="note warn" id="autherr" role="alert"></p>
  </form>
</div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="titlebar">
      <h1>Territory Visits</h1>
      <div class="sub" id="stats"></div>
    </div>
    <div class="views" id="views" role="group" aria-label="View"></div>
    <div class="days" id="days" role="group" aria-label="Route day"></div>
  </header>
  <main>
    <section id="v-route">
      <div class="filters">
        <input class="search" id="search" type="search" placeholder="Search practice, address, phone or provider" autocomplete="off" aria-label="Search offices">
        <div class="chips" id="chips" role="group" aria-label="Filter"></div>
      </div>
      <div class="progress" id="progress"></div>
      <div id="list"><div class="loading">Loading offices...</div></div>
    </section>
    <section id="v-drive" hidden></section>
    <section id="v-follow" hidden></section>
    <section id="v-log" hidden></section>
    <p class="note" id="syncnote"></p>
  </main>
</div>
<div id="sheetroot"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  function h(tag, props) {
    var e = document.createElement(tag);
    props = props || {};
    for (var k in props) {
      var v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      for (var j = 0; j < kids.length; j++) {
        var c = kids[j];
        if (c == null || c === false) continue;
        e.append(c.nodeType ? c : document.createTextNode(String(c)));
      }
    }
    return e;
  }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var DAYS = ['Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5', 'All'];
  var RUN = ['Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5'];
  var FILTERS = [['all', 'All'], ['todo', 'To visit'], ['follow', 'Follow-up'], ['A', 'Tier A'], ['B', 'Tier B'], ['C', 'Tier C'], ['none', 'No tier']];
  var STATUSES = ['To visit', 'Visited', 'Follow-up', 'Not a fit'];
  var OUTCOMES = ['Met decision maker', 'Met staff, left info', 'Gatekeeper only', 'Not in / dropped off', 'Follow-up scheduled', 'Not interested'];
  var ROLES = ['Physician', 'NP / PA', 'Office manager', 'Front desk', 'Nurse / MA', 'Referral coordinator', 'Other'];
  var PRIO = { 'Pulmonology': 0, 'Sleep': 1, 'Primary Care': 2, 'Cardiology': 3, 'Neurology': 4 };

  var OFFICES = [], BYID = {};
  var officeState = {}, visits = [], vmap = {};
  var view = lsGet('tv-view', 'route'), day = lsGet('tv-day', 'Day 1'), filter = lsGet('tv-filter', 'all'), q = '';
  if (DAYS.indexOf(day) < 0) day = 'Day 1';
  var HOME = null, DAYMETA = {}, driveDay = lsGet('tv-driveday', ''), onlyRem = lsGet('tv-onlyrem', '1') === '1';
  var openId = null, editing = null, lastFocus = null, store = null, mode = 'local', dl = null, loaded = false;

  /* dates */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return ymd(new Date()); }
  function parse(s) { var p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
  function fmtLong(s) { return s ? parse(s).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) : ''; }
  function fmtShort(s) { return s ? parse(s).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : ''; }

  /* derived data */
  function st(id) { return officeState[id] || {}; }
  function nameOf(o) { return st(o.id).name || o.name; }
  function tierOf(o) { return st(o.id).tier || ''; }
  function statusOf(o) { return st(o.id).status || 'To visit'; }
  function unconfirmed(o) { return !st(o.id).name && /^(Verify|NPI - verify|Maps - verify)$/.test(o.src); }
  function rebuildIndex() {
    vmap = {};
    visits.slice().sort(function (a, b) { return (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0); })
      .forEach(function (v) { (vmap[v.officeId] = vmap[v.officeId] || []).push(v); });
  }
  function lastVisit(id) { var l = vmap[id]; return l && l[0] ? l[0].date : ''; }
  function suiteText(o) { return o.suite ? 'Ste ' + o.suite.replace(/^(ste|suite|sute|#|\.)\s*/i, '') : ''; }
  function addrLine(o) { return [o.address, suiteText(o)].filter(Boolean).join(' \u00b7 '); }
  function matches(o) {
    var s = statusOf(o), t = tierOf(o);
    if (filter === 'todo' && s !== 'To visit') return false;
    if (filter === 'follow' && s !== 'Follow-up') return false;
    if ((filter === 'A' || filter === 'B' || filter === 'C') && t !== filter) return false;
    if (filter === 'none' && t) return false;
    if (q) {
      var hay = (nameOf(o) + ' ' + o.address + ' ' + o.phone + ' ' + o.zip + ' ' + o.names + ' ' + o.area + ' ' + o.lead).toLowerCase();
      var parts = q.toLowerCase().split(/\s+/).filter(Boolean);
      for (var i = 0; i < parts.length; i++) if (hay.indexOf(parts[i]) < 0) return false;
    }
    return true;
  }

  /* toast + sync note */
  var toastTimer;
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
  }
  function setNote(msg, warn) { var n = $('#syncnote'); n.textContent = msg; n.className = 'note' + (warn ? ' warn' : ''); }

  /* store: shared db when available, this device otherwise */
  var queue = {};
  function chain(key, fn) {
    var p = (queue[key] || Promise.resolve()).then(fn).catch(function (e) {
      console.error(e); toast('That change did not save. Check your connection and try again.');
    });

  function fmtDur(m) { if (!m) return ''; var hr = Math.floor(m / 60), mm = m % 60; return (hr ? hr + ' h ' : '') + mm + ' min'; }
  function firstOpenDay() {
    for (var i = 0; i < RUN.length; i++) if (OFFICES.some(function (o) { return o.day === RUN[i] && statusOf(o) === 'To visit'; })) return RUN[i];
    return RUN[0];
  }
  function pt(o) { return o.approx ? encodeURIComponent(o.address + ' ' + o.zip + ' CO') : o.lat.toFixed(5) + ',' + o.lon.toFixed(5); }
  function legUrl(chunk) {
    var dest = pt(chunk[chunk.length - 1]), wp = chunk.slice(0, -1).map(pt).join('%7C');
    return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + dest + (wp ? '&waypoints=' + wp : '');
  }
  function renderDrive() {
    var s = $('#v-drive'); s.replaceChildren();
    if (RUN.indexOf(driveDay) < 0) driveDay = firstOpenDay();
    var tabs = h('div', { class: 'days', role: 'group', 'aria-label': 'Drive day' });
    RUN.forEach(function (d) {
      var list = OFFICES.filter(function (o) { return o.day === d; });
      var left = list.filter(function (o) { return statusOf(o) === 'To visit'; }).length;
      tabs.append(h('button', { type: 'button', class: 'day', 'aria-pressed': String(driveDay === d), onclick: function () { driveDay = d; lsSet('tv-driveday', d); renderDrive(); } },
        d, h('small', { text: left + ' left' })));
    });
    s.append(tabs);
    var stops = OFFICES.filter(function (o) { return o.day === driveDay; }).sort(function (a, b) { return a.seq - b.seq; });
    var rem = stops.filter(function (o) { return statusOf(o) === 'To visit'; });
    var m = DAYMETA[driveDay] || {};
    s.append(h('div', { class: 'drive-sum' },
      h('div', { class: 'ds-top', text: driveDay + ' \u00b7 ' + stops.length + ' stops \u00b7 zips ' + (m.zips || []).join(', ') }),
      h('div', { class: 'ds-sub', text: 'Loop from Golden and back: about ' + (m.miles || 0) + ' mi, ' + fmtDur(m.minutes) + ' of driving before visit time. Rough estimate.' }),
      h('div', { class: 'ds-sub', text: rem.length + ' of ' + stops.length + ' still to visit' })));
    var shown = onlyRem ? rem : stops;
    s.append(h('div', { class: 'chips', style: 'margin-top:10px' },
      h('button', { type: 'button', class: 'chip', 'aria-pressed': String(onlyRem), onclick: function () { onlyRem = !onlyRem; lsSet('tv-onlyrem', onlyRem ? '1' : '0'); renderDrive(); } }, 'Only stops left')));
    if (!shown.length) { s.append(h('div', { class: 'empty', text: 'Every stop on this day is worked. Pick another day above.' })); return; }
    var navs = h('div', { class: 'navs' });
    for (var i = 0; i < shown.length; i += 9) {
      var chunk = shown.slice(i, i + 9);
      navs.append(h('a', { href: legUrl(chunk), target: '_blank', rel: 'noopener' }, 'Navigate stops ' + chunk[0].seq + '\u2013' + chunk[chunk.length - 1].seq));
    }
    navs.append(h('a', { class: 'alt', href: 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=Golden%2C%20CO', target: '_blank', rel: 'noopener' }, 'Head home'));
    s.append(navs);
    s.append(h('div', { class: 'hint', style: 'margin:6px 0 12px', text: 'Each button opens up to 9 stops in Google Maps from where you are. Stops are in driving order.' }));
    var wrap = h('div', {});
    shown.forEach(function (o) {
      var sx = statusOf(o), lv = lastVisit(o.id);
      wrap.append(h('div', { class: 'stop' + (sx !== 'To visit' ? ' worked' : '') },
        h('span', { class: 'seq', text: o.seq }),
        h('button', { type: 'button', class: 'stop-main', onclick: function (ev) { openSheet(o.id, ev.currentTarget); } },
          h('span', { class: 'o-name', text: nameOf(o) }),
          h('span', { class: 'o-addr', text: addrLine(o) }),
          h('span', { class: 'o-meta' },
            h('span', { class: 'pill' + (PRIO[o.lead] <= 1 ? ' prio' : ''), text: o.lead }),
            tierOf(o) ? h('span', { class: 'pill', text: 'Tier ' + tierOf(o) }) : null,
            sx !== 'To visit' ? h('span', { class: 'pill ' + (sx === 'Follow-up' ? 'follow' : sx === 'Visited' ? 'done' : 'nofit'), text: sx }) : null,
            !onlyRem && o.leg ? h('span', { text: '+' + o.leg + ' mi' }) : null,
            lv ? h('span', { text: 'Last ' + fmtShort(lv) }) : null,
            o.approx ? h('span', { class: 'pill verify', text: 'approx. location' }) : null)),
        h('a', { class: 'go', href: legUrl([o]), target: '_blank', rel: 'noopener', 'aria-label': 'Navigate to ' + nameOf(o) }, 'Go')));
    });
    s.append(wrap);
  }

  function renderAll() {
    if (!loaded) return;
    renderHeader(); renderFilters();
    if (view === 'route') renderList();
    if (view === 'drive') renderDrive();
    if (view === 'follow') renderFollow();
    if (view === 'log') renderLog();
    syncSheet();
  }

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && openId) closeSheet(); });
  $('#search').addEventListener('input', function (e) { q = e.target.value.trim(); renderList(); });

  async function loadOffices() {
    var r = await Promise.all([tdb.from('offices').select('id,data').range(0, 999), tdb.from('meta').select('key,data')]);
    if (r[0].error) throw r[0].error; if (r[1].error) throw r[1].error;
    OFFICES = r[0].data.map(function (x) { return x.data; });
    OFFICES.sort(function (a, b) { return (a.day || '').localeCompare(b.day || '') || (a.seq || 0) - (b.seq || 0); });
    r[1].data.forEach(function (m) { if (m.key === 'home') HOME = m.data; if (m.key === 'days') DAYMETA = m.data; });
    BYID = {}; OFFICES.forEach(function (o) { BYID[o.id] = o; });
  }
  function importCard() {
    var file = h('input', { type: 'file', accept: 'application/json,.json', 'aria-label': 'Office list file' });
    var msg = h('p', { class: 'note' });
    file.addEventListener('change', async function () {
      var f = file.files && file.files[0]; if (!f) return;
      try {
        msg.textContent = 'Loading...';
        var data = JSON.parse(await f.text());
        if (!data.offices || !data.offices.length) throw new Error('No offices in that file.');
        var rows = data.offices.map(function (o) { return { id: o.id, data: o }; });
        for (var i = 0; i < rows.length; i += 100) { var r = await tdb.from('offices').upsert(rows.slice(i, i + 100)); if (r.error) throw r.error; }
        var m = await tdb.from('meta').upsert([{ key: 'home', data: data.home }, { key: 'days', data: data.days || {} }]); if (m.error) throw m.error;
        location.reload();
      } catch (e) { msg.textContent = 'Could not load the file: ' + (e.message || e); msg.className = 'note warn'; }
    });
    return h('div', { class: 'importcard' }, h('strong', { text: 'Load your office list' }),
      h('p', { class: 'note', text: 'One time only: choose the offices.json file you were sent. It is saved to your private database, not to the website.' }), file, msg);
  }
  async function boot() {
    $('#auth').hidden = true; $('#app').hidden = false;
    $('#v-route').hidden = view !== 'route'; $('#v-drive').hidden = view !== 'drive'; $('#v-follow').hidden = view !== 'follow'; $('#v-log').hidden = view !== 'log';
    try { await loadOffices(); } catch (e) {
      $('#list').replaceChildren(h('div', { class: 'empty', text: 'Could not load the office list: ' + (e.message || e) + '. Reload the page to try again.' })); return;
    }
    if (!OFFICES.length) { $('#list').replaceChildren(importCard()); return; }
    await initStore();
    var so = h('button', { type: 'button', class: 'signout', onclick: async function () { await sb.auth.signOut(); location.reload(); } }, 'Sign out');
    $('#syncnote').after(h('p', { class: 'note' }, so));
    loaded = true; renderAll();
  }
  function showLogin() { $('#app').hidden = true; $('#auth').hidden = false; }
  async function start() {
    $('#authform').addEventListener('submit', async function (e) {
      e.preventDefault(); $('#autherr').textContent = '';
      var r = await sb.auth.signInWithPassword({ email: $('#authemail').value.trim(), password: $('#authpass').value });
      if (r.error) { $('#autherr').textContent = 'Sign in failed. Check your email and password.'; return; }
      boot();
    });
    var s = await sb.auth.getSession();
    if (s.data && s.data.session) boot(); else showLogin();
  }
  start();
})();
</script>
</body>
</html>
